<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Storm SSH: Manage your SSH like a boss.</title>
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" id="theme" href="static/css/themes/__THEME__/style.css">
  <script src="static/js/main.js" defer></script>
</head>
<body>
  <div id="main" class="list-0">
    <header>
      <figure id="logo">storm</figure>
      <small id="version">v__VERSION__</small>
      <input type="text" class="total" id="filter" placeholder="0 connections found, filter here.">
    </header>
    <section id="notfound">
      No SSH entry found, add one!
    </section>
    <section id="list"></section>
    <footer class="top">
      <header id="toggle-position">
        <h2 draggable="true"><span id="action">add new</span> ssh entry:</h2>
      </header>
      <section>
        <form id="entry-form">
          <input type="text" id="title" placeholder="$ ssh ...">
          <input type="text" id="uri" placeholder="-> connection uri">
          <input type="text" id="id_file" placeholder="@ ID file">
          <input type="submit" class="subm">
        </form>
      </section>
    </footer>
  </div>
</body>
</html>
