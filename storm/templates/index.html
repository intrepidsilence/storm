<!doctype html>
<html lang="en" data-theme="__THEME__">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>storm · ssh hosts</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="static/css/storm.css?v=__VERSION__">
  <script src="static/js/ssh-links.js?v=__VERSION__" defer></script>
  <script src="static/js/main.js?v=__VERSION__" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 4 13.5h6.5L9 22l11-12.5h-6.8L13.5 2Z"/></svg>
      <span class="brand-name">storm</span>
      <span class="version">v__VERSION__</span>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input type="search" id="filter" placeholder="Filter hosts" autocomplete="off" spellcheck="false" aria-label="Filter hosts">
      <kbd>/</kbd>
    </label>
    <button type="button" class="icon-button" id="theme-toggle" aria-label="Switch theme" title="Switch theme">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></svg>
    </button>
  </header>

  <main class="layout">
    <section class="hosts" aria-labelledby="hosts-title">
      <div class="section-head">
        <h1 id="hosts-title">Hosts</h1>
        <span class="count" id="count">0</span>
      </div>
      <p class="hint">Click a host name to open <code>ssh&nbsp;name</code> in your terminal, or the address to connect to it directly.</p>
      <div id="list" class="host-list" aria-live="polite"></div>
      <div id="empty" class="empty" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>
        <p id="empty-text">No hosts yet. Add your first one.</p>
      </div>
    </section>

    <aside class="editor" aria-labelledby="form-title">
      <form id="entry-form" class="card" novalidate>
        <h2 id="form-title">Add host</h2>
        <label class="field">
          <span>Name</span>
          <input type="text" id="title" placeholder="my-server" autocomplete="off" spellcheck="false" required>
          <small>You'll connect with <code>ssh <span id="name-preview">my-server</span></code></small>
        </label>
        <label class="field">
          <span>Connection</span>
          <input type="text" id="uri" placeholder="user@host:port" autocomplete="off" spellcheck="false" required>
          <small>IPv6 in brackets: <code>root@[2001:db8::1]:22</code></small>
        </label>
        <label class="field">
          <span>Identity file <em>optional</em></span>
          <input type="text" id="id_file" placeholder="~/.ssh/id_ed25519" autocomplete="off" spellcheck="false">
        </label>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <div class="form-actions">
          <button type="submit" class="button primary" id="submit">Add host</button>
          <button type="button" class="button ghost" id="cancel" hidden>Cancel</button>
        </div>
      </form>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
